<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Wonyoungism Sanctuary</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <div class="auth-card">
        <a href="index.html" class="back-link">← Back to Home</a>
        <h2>Welcome Back 🌸</h2>
        <p class="subtitle">Enter your login details to access your sanctuary.</p>

        <form class="auth-form" onsubmit="event.preventDefault(); alert('Signed in successfully!');">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="youremail@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn full-width">Sign In</button>
        </form>

        <p class="auth-footer">Don't have an account? <a href="#">Create one</a></p>
    </div>

</body>
</html>
